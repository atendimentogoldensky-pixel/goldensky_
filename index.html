<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoldenSky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#AFE0F0;
    --sky-deep:#8FCBE3;
    --cream:#FCEBB8;
    --gold:#C79A2B;
    --gold-dark:#9C7419;
    --ink:#4A3510;
    --paper:#FFFDF7;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 120% 60% at 50% 0%, var(--sky) 0%, var(--sky) 28%, var(--cream) 62%, var(--paper) 100%);
    display:flex;
    justify-content:center;
    padding: 0 18px;
  }
  .cloud-deco{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .cloud-deco svg{
    position:absolute;
    opacity:0.35;
  }
  .c1{ top:-40px; left:-60px; width:260px; }
  .c2{ top:60px; right:-70px; width:220px; }
  .c3{ bottom:40px; left:-50px; width:200px; }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    padding:56px 0 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .logo{
    width:150px;
    height:auto;
    margin-bottom:6px;
  }

  .brand{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:2.6rem;
    letter-spacing:0.3px;
    color:var(--gold);
    margin:0;
    line-height:1;
  }

  .tagline{
    margin:10px 0 0;
    font-weight:700;
    font-size:0.98rem;
    color:var(--gold-dark);
    opacity:0.85;
  }

  .links{
    width:100%;
    margin-top:38px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .link-card{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:18px 22px;
    border-radius:20px;
    text-decoration:none;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.12rem;
    line-height:1.25;
    text-align:left;
    border:2px solid transparent;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    box-shadow: 0 4px 0 rgba(0,0,0,0.05);
  }
  .link-card:active{ transform: translateY(2px); box-shadow:none; }

  .link-card .icon{
    flex:0 0 auto;
    width:44px;
    height:44px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .link-card .icon svg{ width:24px; height:24px; }

  .link-card .label small{
    display:block;
    font-family:'Nunito', sans-serif;
    font-weight:600;
    font-size:0.78rem;
    text-transform:none;
    opacity:0.75;
    margin-top:2px;
  }

  .link-loja{
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color:var(--paper);
  }
  .link-loja .icon{ background: rgba(255,255,255,0.22); color:var(--paper); }
  .link-loja .icon svg{ fill:var(--paper); }
  .link-loja:hover{ box-shadow: 0 6px 14px rgba(156,116,25,0.35); }

  .link-whats{
    background: var(--paper);
    color:var(--ink);
    border-color: var(--sky-deep);
  }
  .link-whats .icon{ background: #E9F8EF; }
  .link-whats .icon svg{ fill:#25D366; }
  .link-whats:hover{ box-shadow: 0 6px 14px rgba(143,203,227,0.4); }

  footer{
    margin-top:48px;
    font-size:0.78rem;
    font-weight:600;
    color:var(--gold-dark);
    opacity:0.55;
  }

  @media (prefers-reduced-motion: no-preference){
    .page{ animation: rise .5s ease both; }
    @keyframes rise{
      from{ opacity:0; transform: translateY(10px); }
      to{ opacity:1; transform: translateY(0); }
    }
  }
</style>
</head>
